name: Draw contribution animation

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate contribution animations
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/raw-contribution-light.gif?color_snake=#5E7288&color_dots=#F8F8F7,#E5ECEA,#A9C2B9,#6B8583,#4E6361&color_background=#F8F8F7
            dist/raw-contribution-dark.gif?color_snake=#B3A075&color_dots=#161817,#26302E,#43504D,#6B8583,#A9C2B9&color_background=#161817

      - name: Set animations on framed canvases
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageSequence

          ACCENTS = ("#5E7288", "#6B8583", "#B3A075", "#8D7B80")

          def frame_animation(source, target, background, border, spine):
              image = Image.open(source)
              frames = []
              durations = []

              for frame in ImageSequence.Iterator(image):
                  canvas = Image.new("RGBA", (1024, 294), background)
                  canvas.alpha_composite(frame.convert("RGBA"), (72, 44))

                  draw = ImageDraw.Draw(canvas)
                  draw.rectangle((1, 1, 1022, 292), outline=border, width=2)
                  draw.rectangle((1, 1, 8, 292), fill=spine)
                  for index, color in enumerate(ACCENTS):
                      left = 980 + index * 11
                      draw.rectangle((left, 286, left + 10, 292), fill=color)

                  frames.append(
                      canvas.convert(
                          "P", palette=Image.Palette.ADAPTIVE, colors=256
                      )
                  )
                  durations.append(
                      frame.info.get("duration", image.info.get("duration", 40))
                  )

              frames[0].save(
                  target,
                  save_all=True,
                  append_images=frames[1:],
                  duration=durations,
                  loop=image.info.get("loop", 0),
                  disposal=2,
                  optimize=True,
              )

          frame_animation(
              "dist/raw-contribution-light.gif",
              "dist/contribution-loop.gif",
              "#ECE7E1",
              "#83705C",
              "#4E6361",
          )
          frame_animation(
              "dist/raw-contribution-dark.gif",
              "dist/contribution-loop-dark.gif",
              "#161817",
              "#424744",
              "#B3A075",
          )

          Path("dist/raw-contribution-light.gif").unlink()
          Path("dist/raw-contribution-dark.gif").unlink()
          PY

      - name: Publish generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
