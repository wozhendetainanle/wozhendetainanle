name: Draw contribution animation

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate contribution animations
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contribution-loop.gif?color_snake=#5E7288&color_dots=#F8F8F7,#E5ECEA,#A9C2B9,#6B8583,#4E6361&color_background=#F8F8F7
            dist/contribution-loop-dark.gif?color_snake=#B3A075&color_dots=#0D1117,#26302E,#43504D,#6B8583,#A9C2B9&color_background=#0D1117

      - name: Publish generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
