name: Draw contribution animation

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate contribution animations
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/raw-contribution-light.gif?color_snake=#5E7288&color_dots=#F8F8F7,#E5ECEA,#A9C2B9,#6B8583,#4E6361&color_background=#F8F8F7
            dist/raw-contribution-dark.gif?color_snake=#B3A075&color_dots=#161817,#26302E,#43504D,#6B8583,#A9C2B9&color_background=#161817

      - name: Set animations on framed canvases
        run: |
          sudo apt-get update
          sudo apt-get install --yes imagemagick

          convert dist/raw-contribution-light.gif -coalesce \
            -background "#F4F3F0" -alpha remove -alpha off \
            -bordercolor "#F4F3F0" -border 72x44 \
            -fill none -stroke "#C9C6BF" -strokewidth 2 \
            -draw "rectangle 1,1 1022,292" \
            -stroke none -fill "#4E6361" \
            -draw "rectangle 1,1 8,292" \
            -fill "#5E7288" -draw "rectangle 980,286 990,292" \
            -fill "#6B8583" -draw "rectangle 991,286 1001,292" \
            -fill "#B3A075" -draw "rectangle 1002,286 1012,292" \
            -fill "#8D7B80" -draw "rectangle 1013,286 1022,292" \
            -layers OptimizePlus dist/contribution-loop.gif

          convert dist/raw-contribution-dark.gif -coalesce \
            -background "#161817" -alpha remove -alpha off \
            -bordercolor "#161817" -border 72x44 \
            -fill none -stroke "#424744" -strokewidth 2 \
            -draw "rectangle 1,1 1022,292" \
            -stroke none -fill "#B3A075" \
            -draw "rectangle 1,1 8,292" \
            -fill "#5E7288" -draw "rectangle 980,286 990,292" \
            -fill "#6B8583" -draw "rectangle 991,286 1001,292" \
            -fill "#B3A075" -draw "rectangle 1002,286 1012,292" \
            -fill "#8D7B80" -draw "rectangle 1013,286 1022,292" \
            -layers OptimizePlus dist/contribution-loop-dark.gif

          rm dist/raw-contribution-light.gif dist/raw-contribution-dark.gif

      - name: Publish generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
