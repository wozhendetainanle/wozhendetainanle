name: Draw contribution animation

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out profile source
        uses: actions/checkout@v4

      - name: Generate contribution animations
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contribution-data.gif?color_snake=#AD7A62&color_dots=#D8D4CC,#CFDAD5,#A9C2B9,#6B8583,#4E6361&color_background=#EFECE6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render the editorial contribution serpent
        run: |
          python -m pip install --quiet pillow
          python .github/scripts/render_contribution_serpent.py \
            --source dist/contribution-data.gif \
            --light-output dist/contribution-serpent-light.gif \
            --dark-output dist/contribution-serpent-dark.gif
          rm dist/contribution-data.gif

      - name: Publish generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
