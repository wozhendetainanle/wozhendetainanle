<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 84" role="img" aria-labelledby="title">
  <title id="title">Observe, reason, act</title>
  <style>
    text { font: 500 10px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 2.4px; }
    @media (prefers-reduced-motion: reduce) { .moving { display: none; } }
  </style>
  <path d="M42 28H638" fill="none" stroke="#d9e0dc" stroke-width="1.5"/>
  <g fill="#9aaba3">
    <circle cx="42" cy="28" r="3"/>
    <circle cx="340" cy="28" r="3"/>
    <circle cx="638" cy="28" r="3"/>
  </g>
  <g class="moving" fill="#b77c63">
    <circle cx="42" cy="28" r="11" opacity=".13">
      <animate attributeName="cx" values="42;340;638;340;42" keyTimes="0;.25;.5;.75;1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="42" cy="28" r="4">
      <animate attributeName="cx" values="42;340;638;340;42" keyTimes="0;.25;.5;.75;1" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g fill="#76877e" text-anchor="middle">
    <text x="42" y="66">OBSERVE</text>
    <text x="340" y="66">REASON</text>
    <text x="638" y="66">ACT</text>
  </g>
</svg>
